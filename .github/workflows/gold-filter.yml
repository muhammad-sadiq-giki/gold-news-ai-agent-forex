name: Gold News Filter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run Gold News Filter
        run: python gold_filter.py

      - name: Save news memory
        run: |
          git config --global user.name "Gold News AI"
          git config --global user.email "gold-news-ai@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then
            echo "No changes to seen_news.json"
          else
            git commit -m "Update seen news memory"
            git push
          fi
